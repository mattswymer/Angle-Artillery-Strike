name: Physics tests

on:
  push:
    branches: [main, feature/physics-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Run headless Planck tests
        run: npm test
