name: Physics tests

on:
  push:
    branches:
      - feature/unified-physics-rig
  pull_request:
    branches:
      - main

jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:physics
